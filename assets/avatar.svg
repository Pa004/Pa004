<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-labelledby="title desc"><title id="title">Pablo Domínguez avatar</title><desc id="desc">An animated pixel monogram that assembles from colored blocks.</desc><metadata xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dcterms="http://purl.org/dc/terms/"><rdf:RDF><rdf:Description><dc:title xmlns:dc="http://purl.org/dc/elements/1.1/">Identicon</dc:title><dc:creator xmlns:dc="http://purl.org/dc/elements/1.1/">DiceBear</dc:creator><dc:source xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:type="dcterms:URI">https://www.dicebear.com</dc:source><dcterms:license xsi:type="dcterms:URI">https://creativecommons.org/publicdomain/zero/1.0/</dcterms:license></rdf:Description></rdf:RDF></metadata>
  <style>
    .b{transform-box:fill-box;transform-origin:center;animation:breathe 3s ease-in-out infinite}
    @keyframes breathe{0%,100%{opacity:.5;transform:scale(.82)}50%{opacity:1;transform:scale(1)}}
    @media (prefers-reduced-motion:reduce){.b{animation:none;opacity:1;transform:none}}
  </style>
  <rect width="100" height="100" rx="22" fill="#0d1117"/>
  <rect class="b" x="6" y="6" width="16" height="16" rx="3" fill="#58a6ff" style="animation-delay:0s"/>
  <rect class="b" x="24" y="6" width="16" height="16" rx="3" fill="#58a6ff" style="animation-delay:-.2s"/>
  <rect class="b" x="60" y="6" width="16" height="16" rx="3" fill="#58a6ff" style="animation-delay:-.4s"/>
  <rect class="b" x="78" y="6" width="16" height="16" rx="3" fill="#58a6ff" style="animation-delay:-.6s"/>
  <rect class="b" x="42" y="24" width="16" height="16" rx="3" fill="#bc8cff" style="animation-delay:-.8s"/>
  <rect class="b" x="24" y="42" width="16" height="16" rx="3" fill="#3fb950" style="animation-delay:-1s"/>
  <rect class="b" x="60" y="42" width="16" height="16" rx="3" fill="#3fb950" style="animation-delay:-1.2s"/>
  <rect class="b" x="6" y="60" width="16" height="16" rx="3" fill="#e3b341" style="animation-delay:-1.4s"/>
  <rect class="b" x="78" y="60" width="16" height="16" rx="3" fill="#e3b341" style="animation-delay:-1.6s"/>
  <rect class="b" x="6" y="78" width="16" height="16" rx="3" fill="#f0883e" style="animation-delay:-1.8s"/>
  <rect class="b" x="24" y="78" width="16" height="16" rx="3" fill="#f0883e" style="animation-delay:-2s"/>
  <rect class="b" x="42" y="78" width="16" height="16" rx="3" fill="#f0883e" style="animation-delay:-2.2s"/>
  <rect class="b" x="60" y="78" width="16" height="16" rx="3" fill="#f0883e" style="animation-delay:-2.4s"/>
  <rect class="b" x="78" y="78" width="16" height="16" rx="3" fill="#f0883e" style="animation-delay:-2.6s"/>
</svg>
