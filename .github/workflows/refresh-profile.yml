name: Refresh profile assets

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/refresh-profile.yml"
      - ".github/profile-3d-settings.json"

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: stats
          options: theme=github-dark&hide_border=true&show_icons=true
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2.0.2
        with:
          card: top-langs
          options: theme=github-dark&hide_border=true&layout=compact&langs_count=8
          path: assets/languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate streak card
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: theme=github-dark&hide_border=true&mode=weekly
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate activity graph
        uses: maurodesouza/github-readme-activity-graph-action@v1.0.0
        with:
          username: ${{ github.repository_owner }}
          options: theme=github-dark&hide_border=true&custom_title=GitHub%20Activity
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout 3D contribution generator
        uses: actions/checkout@v4
        with:
          repository: yoshi389111/github-profile-3d-contrib
          ref: v0.9.3
          path: .3d-generator

      - name: Generate 3D contribution calendar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-settings.json
        run: |
          for i in 1 2 3 4 5; do
            echo "3D generation attempt $i"
            if node .3d-generator/dist/index.js; then
              echo "3D calendar generated on attempt $i"
              break
            fi
            echo "Attempt $i failed (transient 503). Retrying in 30s..."
            sleep 30
          done
          if [ ! -f profile-3d-contrib/profile-green-dual.svg ]; then
            echo "::error::3D calendar generation failed after 5 attempts"
            exit 1
          fi
          cp profile-3d-contrib/profile-green-dual.svg assets/profile-3d.svg

      - name: Generate contribution snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/snake.svg
            assets/snake-dark.svg?palette=github-dark

      - name: Commit and push generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(profile): refresh stats assets"
            git push
          fi